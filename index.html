<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gør broen glad</title>
<meta name="description" content="Broen er en lille en, der bor i din lomme. Kør over Øresund og gør den glad.">
<meta name="theme-color" content="#0E3B4E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Broen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&family=Silkscreen&display=swap">
<style>
  :root{
    --sea:#0E3B4E; --sea-2:#1B6A86; --heart:#FF6B8A;
    --shell:#F4F7F9; --shell-2:#CBD7DE; --shell-3:#A9BAC3;
    --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    --body:"Nunito",system-ui,-apple-system,sans-serif;
    --pixel:"Silkscreen","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--body); color:#0F2430; -webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 80% at 50% 0%, #1B6A86, #0E3B4E 60%, #071E2A);
    display:flex; align-items:center; justify-content:center;
    padding:max(10px, env(safe-area-inset-top)) 10px max(12px, env(safe-area-inset-bottom));
    touch-action:manipulation; -webkit-tap-highlight-color:transparent; overflow:hidden;
  }
  /* ============ tamagotchi shell ============ */
  .egg{
    position:relative; width:100%; max-width:420px; margin:0 auto; padding:26px 26px 30px;
    border-radius:48% 48% 46% 46% / 40% 40% 52% 52%;
    background:radial-gradient(120% 90% at 30% 15%, #fff 0%, var(--shell) 40%, var(--shell-2) 100%);
    box-shadow:inset 0 -8px 0 var(--shell-3), inset 0 4px 0 #fff, 0 30px 50px -26px rgba(14,59,78,.6);
  }
  .egg::before{ /* ring bezel highlight */
    content:""; position:absolute; inset:14px; border-radius:inherit; pointer-events:none;
    border:2px solid rgba(255,255,255,.7); mix-blend-mode:screen;
  }
  .brand{font-family:var(--pixel); font-size:9px; letter-spacing:.2em; color:#6A8290; text-align:center; margin-bottom:10px}
  .lcd{
    position:relative; overflow:hidden; border-radius:26px; background:#0A1E27;
    box-shadow:inset 0 0 0 5px #0A1E27, inset 0 0 0 7px #2A4553, 0 0 0 3px var(--shell-3);
    aspect-ratio: 4/5;
  }
  .scene{position:absolute; inset:7px; border-radius:20px; overflow:hidden; cursor:pointer; user-select:none;
    --sky-a:#BFE6FA; --sky-b:#E9F7FF; --water:#2C89B0; --sunop:1;
    background:linear-gradient(180deg,var(--sky-a),var(--sky-b));
    transition:background 1.2s ease;
  }
  .m-overlykkelig{--sky-a:#7FCBF3; --sky-b:#FFF2C8; --water:#2FA0C7}
  .m-glad        {--sky-a:#8FD0F2; --sky-b:#E9F7FF; --water:#2C89B0}
  .m-tilfreds    {--sky-a:#9CC5D8; --sky-b:#DDE9EE; --water:#3A7F98}
  .m-trist       {--sky-a:#6E8B99; --sky-b:#AEBFC7; --water:#2E5A6B}
  .m-kedafdet    {--sky-a:#3E525C; --sky-b:#71838B; --water:#1F3C47}
  .m-sover       {--sky-a:#0F1F3B; --sky-b:#2B3F66; --water:#14263A}
  .scene svg{position:absolute; inset:0; width:100%; height:100%}

  /* weather layers */
  .sun{transform-origin:250px 62px; transition:opacity 1s ease; animation:spin 40s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .m-trist .sun{opacity:.25} .m-kedafdet .sun,.m-sover .sun{opacity:0}
  .moon{opacity:0; transition:opacity 1s} .m-sover .moon{opacity:1}
  .stars{opacity:0; transition:opacity 1s} .m-sover .stars{opacity:1}
  .fair{transition:transform 1.4s cubic-bezier(.2,.8,.2,1), opacity 1s; }
  .storm{transition:transform 1.4s cubic-bezier(.2,.8,.2,1), opacity 1s; transform:translateY(-140px); opacity:0}
  .m-trist .storm{transform:translateY(-30px); opacity:.85}
  .m-kedafdet .storm{transform:translateY(0); opacity:1}
  .m-trist .fair,.m-kedafdet .fair,.m-sover .fair{opacity:0; transform:translateY(-60px)}
  .rain{opacity:0; transition:opacity .8s}
  .m-trist .rain{opacity:.35} .m-kedafdet .rain{opacity:.8}
  .rain line{animation:fall 1.1s linear infinite}
  @keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(300px)}}
  .heartcloud{opacity:0; transition:opacity 1.2s, transform 1.2s; transform:scale(.6); transform-origin:270px 80px}
  .m-overlykkelig .heartcloud{opacity:.95; transform:scale(1)}

  /* bridge body */
  .bridge{transform-origin:160px 236px}
  .bridge.hop{animation:hop .7s cubic-bezier(.3,1.6,.4,1) 2}
  @keyframes hop{0%,100%{transform:scale(1,1)}25%{transform:scale(1.05,.93)}55%{transform:scale(.97,1.06) translateY(-8px)}80%{transform:scale(1.03,.96)}}
  .bridge.wiggle{animation:wiggle .5s ease-in-out 2}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
  .m-kedafdet .bridge{animation:shiver 2.2s ease-in-out infinite}
  @keyframes shiver{0%,100%{transform:translateX(0)}20%{transform:translateX(-.8px)}40%{transform:translateX(.8px)}60%{transform:translateX(-.5px)}}
  .m-sover .bridge{animation:snore 4s ease-in-out infinite}
  @keyframes snore{0%,100%{transform:scale(1)}50%{transform:scale(1.012,1.02)}}

  /* face bits */
  .eye .lid{transform-origin:center; transform:scaleY(0); transition:transform .12s}
  .blink .eye .lid{transform:scaleY(1)}
  .m-sover .eye .lid{transform:scaleY(1)}
  .eye .lidsad{opacity:0; transition:opacity .6s}
  .m-trist .eye .lidsad{opacity:.9} .m-kedafdet .eye .lidsad{opacity:1}
  .wink .eye.r .lid{transform:scaleY(1)}
  .sparkle{opacity:0; transition:opacity .5s} .m-overlykkelig .sparkle{opacity:1; animation:twinkle 1.2s ease-in-out infinite}
  @keyframes twinkle{50%{transform:scale(.7)}} .sparkle path{transform-origin:center; transform-box:fill-box}
  .blush{opacity:0; transition:opacity .6s}
  .m-glad .blush{opacity:.55} .m-overlykkelig .blush,.blushing .blush{opacity:.9}
  .tears{opacity:0; transition:opacity .6s}
  .m-kedafdet .tears{opacity:1}
  .tears path{animation:tear 1.6s ease-in infinite}
  .tears path.b{animation-delay:-.8s}
  @keyframes tear{0%{transform:translateY(0); opacity:0}15%{opacity:1}100%{transform:translateY(60px); opacity:0}}
  #mouth{transition:d .4s ease}
  .zzz{opacity:0} .m-sover .zzz{opacity:1; animation:zz 2.8s ease-in-out infinite}
  .zzz.b{animation-delay:-1.4s}
  @keyframes zz{0%{transform:translate(0,0); opacity:0}30%{opacity:1}100%{transform:translate(14px,-26px); opacity:0}}

  /* HUD on LCD */
  .hud{position:absolute; left:14px; right:14px; top:12px; display:flex; justify-content:space-between; align-items:center; z-index:3; pointer-events:none}
  .needs{display:flex; gap:8px}
  .need{
    display:flex; align-items:center; gap:4px; font-family:var(--pixel); font-size:9px; letter-spacing:.06em;
    background:rgba(10,30,39,.55); color:#E9F5F9; padding:4px 7px; border-radius:999px; backdrop-filter:blur(4px);
  }
  .need .hearts{letter-spacing:-1px; font-size:10px; color:#FF8FA6}
  .need .hearts .off{opacity:.25}
  .day{font-family:var(--pixel); font-size:9px; color:#E9F5F9; background:rgba(10,30,39,.55); padding:4px 8px; border-radius:999px; letter-spacing:.08em}

  .moodtag{
    position:absolute; left:14px; bottom:66px; z-index:3; pointer-events:none;
    font-family:var(--display); font-weight:800; font-size:28px; letter-spacing:-.01em; color:#fff;
    text-shadow:0 2px 0 rgba(10,30,39,.35), 0 8px 24px rgba(10,30,39,.35); line-height:1;
  }
  .moodtag small{display:block; font-family:var(--pixel); font-size:9px; letter-spacing:.14em; opacity:.9; margin-bottom:6px; font-weight:400}
  .bubble{
    position:absolute; left:12px; right:12px; bottom:12px; z-index:3;
    background:rgba(255,255,255,.94); color:#0F2430; border-radius:14px; padding:9px 12px;
    font-size:13px; line-height:1.4; font-weight:600; text-wrap:balance; pointer-events:none;
    box-shadow:0 6px 18px -8px rgba(10,30,39,.5);
  }
  .bubble::before{content:""; position:absolute; left:50%; top:-7px; width:12px; height:12px; background:inherit; transform:translateX(-50%) rotate(45deg); border-radius:2px}
  .bubble b{color:var(--sea-2)}

  #fx{position:absolute; inset:0; pointer-events:none; z-index:4}
  .floater{
    position:absolute; z-index:5; pointer-events:none; font-family:var(--display); font-weight:800; font-size:22px; color:#fff;
    text-shadow:0 2px 0 rgba(10,30,39,.4); animation:rise 1.1s ease-out forwards; transform:translateX(-50%);
  }
  @keyframes rise{0%{opacity:0; transform:translate(-50%,0) scale(.6)}18%{opacity:1; transform:translate(-50%,-10px) scale(1.15)}100%{opacity:0; transform:translate(-50%,-70px) scale(1)}}
  .heart{position:absolute; z-index:5; pointer-events:none; font-size:18px; animation:heartup 1.3s ease-out forwards}
  @keyframes heartup{0%{opacity:0; transform:translate(0,0) scale(.4)}20%{opacity:1; transform:translate(0,-10px) scale(1.1)}100%{opacity:0; transform:translate(var(--dx),-90px) scale(1) rotate(var(--rot))}}
  .flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4}
  .flash.go{animation:fl .7s ease-out}
  @keyframes fl{0%{opacity:.7}100%{opacity:0}}
  .lvlup{
    position:absolute; inset:0; z-index:6; display:grid; place-items:center; text-align:center; padding:20px;
    background:radial-gradient(circle at 50% 40%, rgba(255,209,102,.97), rgba(255,140,120,.97) 60%, rgba(255,107,138,.98));
    opacity:0; pointer-events:none; transition:opacity .35s; color:#3A1B22;
  }
  .lvlup.show{opacity:1}
  .lvlup .k{font-family:var(--pixel); font-size:10px; letter-spacing:.2em}
  .lvlup .t{font-family:var(--display); font-weight:800; font-size:30px; line-height:1.02; margin:8px 0 6px; text-wrap:balance}
  .lvlup .s{font-size:14px; max-width:28ch; margin:0 auto; font-weight:600; line-height:1.45}
  .lvlup.show{pointer-events:auto}
  .lu-ok{margin-top:18px; border:0; border-radius:999px; padding:11px 22px; background:#3A1B22; color:#FFE29A; font-family:var(--display); font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .lu-ok:active{transform:translateY(3px); box-shadow:none}

  /* physical buttons */
  .keys{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin:22px 10px 0}
  .key{
    appearance:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:transparent; font-family:var(--body); color:#3E5A68; font-weight:700; font-size:12px;
  }
  .key .cap{
    width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:26px;
    background:radial-gradient(circle at 35% 30%, #fff, #DCE7EC 60%, #B7C7D0);
    box-shadow:0 6px 0 #8DA1AC, 0 10px 18px -8px rgba(14,59,78,.6), inset 0 2px 0 #fff;
    transition:transform .08s, box-shadow .08s;
  }
  .key.a .cap{background:radial-gradient(circle at 35% 30%, #FFF3D6, #FFD166 60%, #E5A62C); box-shadow:0 6px 0 #B3781B, 0 10px 18px -8px rgba(14,59,78,.6), inset 0 2px 0 #fff}
  .key.b .cap{background:radial-gradient(circle at 35% 30%, #FFE3EA, #FF8FA6 60%, #E45A7A); box-shadow:0 6px 0 #B23A58, 0 10px 18px -8px rgba(14,59,78,.6), inset 0 2px 0 #fff}
  .key:active .cap,.key.pressed .cap{transform:translateY(5px); box-shadow:0 1px 0 #8DA1AC, inset 0 2px 0 #fff}
  .key.a:active .cap,.key.a.pressed .cap{box-shadow:0 1px 0 #B3781B, inset 0 2px 0 #fff}
  .key.b:active .cap,.key.b.pressed .cap{box-shadow:0 1px 0 #B23A58, inset 0 2px 0 #fff}
  .key:focus-visible .cap{outline:3px solid var(--sea-2); outline-offset:3px}
  .key small{font-family:var(--pixel); font-size:8px; letter-spacing:.12em; color:#7590A0; font-weight:400}


  /* original concept egg, sized to the phone */
  body{display:flex; align-items:center; justify-content:center; padding:0; background:radial-gradient(120% 80% at 50% 0%, #1B6A86, #0E3B4E 60%, #071E2A)}
  .egg{width:min(94vw, 400px); max-width:none; margin:0}
  @media (max-height:720px){ .egg{width:min(94vw, 340px)} .keys .cap{width:56px; height:56px} }
  .menu{bottom:max(14px, env(safe-area-inset-bottom)); top:auto; right:16px}
  .menu summary{background:rgba(255,255,255,.14); color:#fff; font-size:16px; width:32px; height:32px}
  .menu .m{bottom:42px; top:auto}
  .install{bottom:max(14px, env(safe-area-inset-bottom)); top:auto; left:16px}

  /* bropoint + rewards sheet */
  .hud{pointer-events:none} .hud .pts{pointer-events:auto}
  .pts{
    appearance:none; border:0; cursor:pointer; display:flex; align-items:center; gap:6px;
    font-family:var(--pixel); font-size:9px; letter-spacing:.08em; color:#3A2A08;
    background:linear-gradient(180deg,#FFE29A,#FFD166); padding:5px 9px; border-radius:999px;
    box-shadow:0 2px 0 #B3781B; transition:transform .08s;
  }
  .pts:active{transform:translateY(2px); box-shadow:none}
  .pts b{font-size:11px; letter-spacing:0}
  .pts .rb{background:#3A2A08; color:#FFE29A; padding:1px 5px; border-radius:6px}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:7; max-height:100%; overflow:hidden;
    background:#F6FAFC; color:#0F2430; border-radius:20px 20px 0 0; display:flex; flex-direction:column;
    transform:translateY(105%); transition:transform .38s cubic-bezier(.2,1,.3,1); box-shadow:0 -10px 30px -10px rgba(0,0,0,.5);
  }
  .sheet.show{transform:translateY(0)}
  .sh-head{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; padding:14px 14px 10px; background:linear-gradient(180deg,#FFE29A,#FFD166); color:#3A2A08}
  .sh-head small{display:block; font-family:var(--pixel); font-size:8px; letter-spacing:.14em; opacity:.75}
  .sh-head b{font-family:var(--display); font-weight:800; font-size:22px; line-height:1.1}
  .sh-head .tier b{font-size:15px}
  .sh-close{border:0; background:rgba(58,42,8,.15); color:#3A2A08; width:28px; height:28px; border-radius:50%; cursor:pointer; font-weight:800; align-self:start}
  .tabs{display:flex; gap:4px; padding:10px 12px 0}
  .tabs button{flex:1; border:0; background:transparent; font-family:var(--body); font-weight:800; font-size:12px; color:#7590A0; padding:7px 4px; border-radius:9px; cursor:pointer}
  .tabs button.on{background:#0E3B4E; color:#fff}
  .list{overflow:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1}
  .rw{display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; background:#fff; border:1px solid #DCE7EC; border-radius:12px; padding:8px 10px}
  .rw .ri{font-size:22px; line-height:1}
  .rw .rn{font-weight:800; font-size:13px; line-height:1.2}
  .rw .rs{font-size:11px; color:#7590A0}
  .rw button{border:0; border-radius:999px; padding:7px 10px; font-family:var(--pixel); font-size:9px; letter-spacing:.04em; cursor:pointer; background:#FFD166; color:#3A2A08; box-shadow:0 2px 0 #B3781B; white-space:nowrap}
  .rw button:disabled{background:#E3EBEF; color:#9AAEB8; box-shadow:none; cursor:not-allowed}
  .earn{font-family:var(--pixel); font-size:8px; letter-spacing:.06em; color:#7590A0; padding:8px 14px 12px; border-top:1px solid #DCE7EC; text-align:center; line-height:1.7}
  .bp-float{color:#FFE29A}

  /* discreet demo menu */
  .menu{position:fixed; right:12px; bottom:max(10px, env(safe-area-inset-bottom)); z-index:20}
  .menu summary{list-style:none; cursor:pointer; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.14); color:#fff; font-weight:800; font-family:var(--display); font-size:18px; line-height:1}
  .menu summary::-webkit-details-marker{display:none}
  .menu .m{position:absolute; right:0; bottom:42px; background:#fff; border-radius:12px; padding:8px; display:flex; flex-direction:column; gap:4px; min-width:190px; box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
  .menu .m button{font-family:var(--body); font-weight:700; font-size:13px; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px; cursor:pointer; color:#0F2430}
  .menu .m button:hover{background:#E9F1F5}
  .menu .m .h{font-family:var(--pixel); font-size:8px; letter-spacing:.14em; color:#7590A0; padding:4px 10px 0}
  .install{position:fixed; left:12px; bottom:max(10px, env(safe-area-inset-bottom)); z-index:20; display:none; border:0; border-radius:999px; padding:8px 14px; background:#FFD166; color:#3A2A08; font-family:var(--body); font-weight:800; font-size:13px; cursor:pointer}
  .install.show{display:block}
  .sheet{height:100%} .list{min-height:0}
</style>
</head>
<body>
  <main class="egg">
    <div class="brand">ØRESUNDSBROEN · BROVÄN · BROVEN</div>
      <div class="lcd">
        <div class="scene m-glad" id="scene" title="Nus broen">
          <svg viewBox="0 0 320 400" preserveAspectRatio="xMidYMid slice" aria-label="Broen, personificeret">
            <defs>
              <linearGradient id="gw" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="var(--water)"/><stop offset="1" stop-color="#0A2733"/>
              </linearGradient>
              <linearGradient id="gleg" x1="0" x2="1">
                <stop offset="0" stop-color="#F3F0E8"/><stop offset=".55" stop-color="#E6E1D6"/><stop offset="1" stop-color="#C9C2B4"/>
              </linearGradient>
              <radialGradient id="gsun"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="#FFD166"/></radialGradient>
              <clipPath id="eyeL"><ellipse cx="117" cy="112" rx="21" ry="24"/></clipPath>
              <clipPath id="eyeR"><ellipse cx="203" cy="112" rx="21" ry="24"/></clipPath>
            </defs>

            <!-- sky objects -->
            <g class="stars" fill="#fff">
              <circle cx="40" cy="40" r="1.4"/><circle cx="90" cy="24" r="1"/><circle cx="60" cy="90" r="1.2"/>
              <circle cx="250" cy="30" r="1.3"/><circle cx="290" cy="70" r="1"/><circle cx="20" cy="140" r="1"/><circle cx="300" cy="130" r="1.2"/>
            </g>
            <g class="moon"><circle cx="262" cy="60" r="22" fill="#FFF4CF"/><circle cx="272" cy="52" r="20" fill="var(--sky-a)"/></g>
            <g class="sun">
              <g stroke="#FFE59A" stroke-width="6" stroke-linecap="round" opacity=".55">
                <path d="M250 8 v18 M250 98 v18 M196 62 h18 M286 62 h18 M212 24 l13 13 M275 87 l13 13 M212 100 l13-13 M275 37 l13-13"/>
              </g>
              <circle cx="250" cy="62" r="26" fill="url(#gsun)"/>
            </g>
            <g class="heartcloud" fill="#fff">
              <path d="M270 92 c-10-18-38-10-30 10 c5 12 30 28 30 28 c0 0 25-16 30-28 c8-20-20-28-30-10z"/>
            </g>
            <g class="fair" fill="#fff" opacity=".95">
              <ellipse cx="60" cy="70" rx="30" ry="12"/><ellipse cx="78" cy="62" rx="20" ry="14"/><ellipse cx="44" cy="64" rx="16" ry="11"/>
              <ellipse cx="290" cy="150" rx="26" ry="10"/><ellipse cx="302" cy="144" rx="14" ry="10"/>
            </g>
            <g class="storm">
              <g fill="#4A5B64"><ellipse cx="60" cy="50" rx="62" ry="24"/><ellipse cx="100" cy="36" rx="40" ry="26"/><ellipse cx="20" cy="42" rx="34" ry="22"/></g>
              <g fill="#38474F"><ellipse cx="270" cy="44" rx="58" ry="22"/><ellipse cx="240" cy="30" rx="36" ry="24"/><ellipse cx="305" cy="36" rx="34" ry="20"/></g>
              <g fill="#56666E"><ellipse cx="165" cy="26" rx="50" ry="18"/></g>
            </g>
            <g class="rain" stroke="#DCEDF4" stroke-width="1.6" stroke-linecap="round">
              <line x1="20" y1="0" x2="16" y2="18" style="animation-delay:-.2s"/><line x1="60" y1="0" x2="56" y2="18" style="animation-delay:-.7s"/>
              <line x1="95" y1="0" x2="91" y2="18" style="animation-delay:-.4s"/><line x1="150" y1="0" x2="146" y2="18" style="animation-delay:-.9s"/>

<script>
(function(){

    overlykkelig:["TVÅ ture på én uge?! Jag kan inte holde mig i ro! <b>Tusen tack!</b>","Jeg har pudset alle mine kabler til dig. Alla. Varenda en. Puss!","Solen skinner, og det er DIN skyld, älskling.","Skål för dig! Med Øresundsvand. Det er det, jeg har."],
    glad:["Är det dig? Det ER dig! <b>Hej hej!</b> Hvornår kører vi igen?","Jeg så din bil helt fra Peberholm. Jag vinkade. Hyggeligt!","Der er en mågeunge på pylon 3. Vi kalder den Bengt. Bengt är fin.","Ska vi fika? Jeg har ingen kanelbullar. Men jag har dig."],

  var tab="dk";
  function fmt(n){ return n.toLocaleString("da-DK"); }
  function rabat(){ return RABAT[levelOf()]; }

    $("shBp").textContent=fmt(S.bp); $("shTier").textContent=rabat()+" % på alle ture"; $("shDay").textContent="DAG "+S.dag+" · LV "+(levelOf()+1);
    var nl=LEVELS[levelOf()+1]; $("shNext").textContent = nl ? RABAT[levelOf()+1]+" % ved "+fmt(nl.xp-S.xp)+" XP" : "MAX";
    var L=$("shList"); L.innerHTML="";

      var d=document.createElement("div"); d.className="rw";

      d.innerHTML='<span class="ri">'+r.i+'</span><span><div class="rn">'+r.n+'</div><div class="rs">'+r.s+'</div></span>';
      var b=document.createElement("button"); b.textContent= owned ? "HAR DEN" : fmt(r.c)+" BP"; b.disabled = owned || S.bp<r.c;
      b.addEventListener("click", function(){ redeem(r); }); d.appendChild(b); L.appendChild(d);
    });
  }
  function redeem(r){
    if(S.bp<r.c) return;
    S.bp-=r.c; S.kaer=clamp(S.kaer+5); if(r.hat){ S.hat=true; }

  }
  function clamp(v){ return Math.max(0, Math.min(100, v)); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

    if(S.sover) return "sover";
    var v = S.maet*0.65 + S.kaer*0.35;
    if(v>=84) return "overlykkelig"; if(v>=60) return "glad"; if(v>=42) return "tilfreds"; if(v>=22) return "trist"; return "kedafdet";
  }
  function levelOf(){ var i=0; for(var k=0;k<LEVELS.length;k++) if(S.xp>=LEVELS[k].xp) i=k; return i; }

  var MOUTH = {
    overlykkelig:{d:"M134 152 Q160 190 186 152 Q160 162 134 152 Z", fill:"#7A2E3E", brows:"M100 78 Q117 70 134 78 M186 78 Q203 70 220 78", tongue:1},
    glad:{d:"M138 156 Q160 176 182 156", fill:"#7A2E3E", brows:"M100 80 Q117 74 134 80 M186 80 Q203 74 220 80", tongue:0},
    tilfreds:{d:"M142 160 Q160 168 178 160", fill:"none", brows:"M100 82 Q117 78 134 82 M186 82 Q203 78 220 82", tongue:0},
    trist:{d:"M144 164 L176 164", fill:"none", brows:"M100 86 Q117 80 134 84 M186 84 Q203 80 220 86", tongue:0},
    kedafdet:{d:"M142 166 Q160 152 178 166", fill:"none", brows:"M100 90 Q117 78 134 84 M186 84 Q203 78 220 90", tongue:0},
    sover:{d:"M148 162 Q160 170 172 162", fill:"none", brows:"M100 84 Q117 80 134 84 M186 84 Q203 80 220 84", tongue:0}
  };
  function hearts(v){ var n=Math.round(v/25), s=""; for(var i=0;i<4;i++) s+='<span'+(i<n?'':' class="off"')+'>♥</span>'; return s; }

  /* persistence + real-time decay */
  function save(){ S.seen=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function load(){
    try{ var raw=localStorage.getItem(KEY); if(raw){ S=JSON.parse(raw); if(S.bp==null){ S.bp=850; S.hat=false; S.petsToday=0; } } }catch(e){}
    if(!S){ S=JSON.parse(JSON.stringify(base)); return; }
    var days=Math.floor((Date.now()-S.seen)/DAY);
    if(days>0){ decay(days); }
  }
  function decay(days){
    S.dag+=days; S.maet=clamp(S.maet-14*days); S.kaer=clamp(S.kaer-9*days); S.energi=clamp(S.energi+6*days);

    S.petsToday=0; S.sover=false;
  }

  function render(opt){
    opt=opt||{};
    var m=opt.mood||moodKey(), f=MOUTH[m];
    scene.className="scene m-"+m+(opt.blush?" blushing":"");
    $("mouth").setAttribute("d",f.d); $("mouth").setAttribute("fill",f.fill);
    $("tongue").setAttribute("opacity",f.tongue); $("brows").setAttribute("d",f.brows);

    if(!opt.keep) bubble.innerHTML=pick(LINES[m]);

  }
  function say(h){ bubble.innerHTML=h; }

  function floater(t,x,y,cls){ var d=document.createElement("div"); d.className="floater"+(cls?" "+cls:""); d.textContent=t; d.style.left=x+"%"; d.style.top=y+"%"; fx.appendChild(d); setTimeout(function(){d.remove();},1150); }

      var h=document.createElement("div"); h.className="heart"; h.textContent=pick(["💗","💙","💛","🤍"]);

    }
  }
  function press(k){ k.classList.add("pressed"); setTimeout(function(){k.classList.remove("pressed");},130); }

  function buzz(p){ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }

  function blink(){ if(S.sover) return; scene.classList.add("blink"); setTimeout(function(){scene.classList.remove("blink");},130); if(Math.random()<.25) setTimeout(function(){scene.classList.add("blink"); setTimeout(function(){scene.classList.remove("blink");},120);},200); }
  (function loop(){ setTimeout(function(){ blink(); loop(); }, 2400+Math.random()*3200); })();
  (function chatter(){ setTimeout(function(){ if(!lvlup.classList.contains("show")) bubble.innerHTML=pick(LINES[moodKey()]); chatter(); }, 9000+Math.random()*6000); })();

  var pupils=scene.querySelectorAll(".pupil");
  function look(dx,dy){ pupils.forEach(function(p){ p.setAttribute("transform","translate("+dx+" "+dy+")"); }); }
  scene.addEventListener("mousemove", function(e){
    if(S.sover) return;
    var r=scene.getBoundingClientRect(); var dx=((e.clientX-r.left)/r.width-.5)*10, dy=((e.clientY-r.top)/r.height-.35)*8;

        var L=LEVELS[levelOf()]; $("luT").textContent=L.t; $("luS").innerHTML=L.s+"<br><br>🎁 Ny rabat: <b>"+rabat()+" %</b> på alle ture over broen.";

    var enough=S.kaer>=92;
    S.kaer=clamp(S.kaer+7); S.energi=clamp(S.energi-2);
    if(S.petsToday<5){ S.petsToday++; earn(1, x||50, (y||34)-6); }
    render({keep:true, blush:true});
    anim("wiggle",1000); heartsBurst(3, x||50, y||34);
    say(enough ? PET_ENOUGH : pick(PET));
    setTimeout(function(){ scene.classList.remove("blushing"); },1800);
  }
  function sleep(){
    press($("kC")); buzz(20);
    S.sover=!S.sover;
    if(S.sover){ S.energi=clamp(S.energi+30); earn(2,50,30); render({keep:true}); say("Godnat, älskling… tack för i dag. Kør forsigtigt i drømmene. Puss."); look(0,0); }
    else { render({keep:true}); say("*gäspar* …er der biler? Är det DIG? Hej hej!"); blink(); }
  }
  function reset(){ S=JSON.parse(JSON.stringify(base)); render({keep:true}); say("Hej hej! Jag är broen. Kører vi? Ska vi?"); look(0,0); }

  $("kA").addEventListener("click", cross);
  $("kB").addEventListener("click", function(){ pet(); });
  $("kC").addEventListener("click", sleep);
  scene.addEventListener("click", function(e){ var r=scene.getBoundingClientRect(); pet((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100); });
  $("skipDay").addEventListener("click", function(){ decay(1); render(); });
  $("skipWeek").addEventListener("click", function(){ decay(7); render(); });
  $("reset").addEventListener("click", reset);
  $("ptsBtn").addEventListener("click", function(e){ e.stopPropagation(); openSheet(); });
  $("shClose").addEventListener("click", closeSheet);
  $("luOk").addEventListener("click", function(e){ e.stopPropagation(); lvlup.classList.remove("show"); render(); });
  lvlup.addEventListener("click", function(e){ e.stopPropagation(); });
  $("sheet").addEventListener("click", function(e){ e.stopPropagation(); });
  $("tabs").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; tab=b.dataset.t; $("tabs").querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x===b); }); renderSheet(); });
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible"){ var d=Math.floor((Date.now()-S.seen)/DAY); if(d>0){ decay(d); render(); } } else save(); });

  load();
  render({keep:true});
  var m0=moodKey();
  say(S.cross<=1 ? "Hej hej! Jag är broen. Kører vi? Ska vi?" : pick(LINES[m0]));
  if(m0!=="sover") setTimeout(function(){ scene.classList.add("wink"); setTimeout(function(){scene.classList.remove("wink");},450); },1200);

  /* PWA */
  if("serviceWorker" in navigator){ window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js"); }); }
  var deferred=null, ib=$("installBtn");
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred=e; ib.classList.add("show"); });
  ib.addEventListener("click", function(){ if(deferred){ deferred.prompt(); deferred=null; ib.classList.remove("show"); } });
})();
</script>
</body>
</html>
