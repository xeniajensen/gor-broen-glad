<!doctype html><html lang="da"><head><meta charset="utf-8"><title>Hvid</title>
<style>html,body{height:100%;margin:0;background:#fff;cursor:none}</style></head>
<body><script>document.addEventListener("keydown",e=>{if(e.key.toLowerCase()==="f")document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()})</script></body></html>
